name: Build Egyptian ID Reader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13.2
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.13.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13.2/bin" >> "$GITHUB_PATH"

      - name: Download OCR language data
        run: |
          mkdir -p app/src/main/assets/tessdata

          curl -fL --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata -o app/src/main/assets/tessdata/ara.traineddata

          curl -fL --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -o app/src/main/assets/tessdata/eng.traineddata

          test -s app/src/main/assets/tessdata/ara.traineddata
          test -s app/src/main/assets/tessdata/eng.traineddata

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/local/egyptianidreader/MainActivity.kt

      - name: Build debug APK
        run: |
          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Egyptian-ID-Reader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
